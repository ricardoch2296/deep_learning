<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tune generado por el mini-GPT</title>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6/dist/abcjs-basic-min.js"></script>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  #audio { margin-top: 1rem; }
</style>
</head>
<body>
<h2>Tune generado por el mini-GPT (ABC notation)</h2>
<p>Presiona play para escuchar. La partitura se dibuja abajo.</p>
<div id="paper"></div>
<div id="audio"></div>
<pre id="abc-text"></pre>
<script>
const abc = `X:1
M:4/4
K:Am
|:D(3FFF FFEF|ABcd (3efg ag|fd (3dfd Adfa|gfed BA (3Bcd|
cdef ecAc|BGGE FDD2|GABc efge|1 dBAc d4:|2 dBAc d2cd||
eA (3AAA eA (3AAA|eA (3AAA eA (3AAA|eA (3AAA eA (3AAA|eage dBAe|
fd (3dfd Adfd|gfed eA (3AAA|eA (3AAA eA (3AAA|ecdc d4||`;

document.getElementById("abc-text").textContent = abc;
const visualObj = ABCJS.renderAbc("paper", abc, { responsive: "resize" })[0];

if (ABCJS.synth.supportsAudio()) {
  const synth = new ABCJS.synth.SynthController();
  synth.load("#audio", null, { displayPlay: true, displayProgress: true });
  synth.setTune(visualObj, false);
} else {
  document.getElementById("audio").textContent = "Tu navegador no soporta audio web.";
}
</script>
</body>
</html>
