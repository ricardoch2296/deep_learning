<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tune generado por el mini-GPT</title>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6/dist/abcjs-basic-min.js"></script>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  #audio { margin-top: 1rem; }
</style>
</head>
<body>
<h2>Tune generado por el mini-GPT (ABC notation con acordes)</h2>
<p>Presiona play para escuchar melodia + acordes de acompanamiento. La partitura se dibuja abajo.</p>
<div id="paper"></div>
<div id="audio"></div>
<pre id="abc-text"></pre>
<script>
const abc = `X:1
T:The Brong The Gron
M:6/8
K:D
"D"d2A AFA|"D"d2d fga|"G"bag "A7"edc|"D"d3 d2::
A|"D"F2A AFA|"Bm"d2d "A"e2A|"Em"B2d "A7"efg|"D"fga "A7"bag|
"D"a2d AFA|"G"B2d "A7"efg|"D"aga "A7"gec|"D"d3 -d2:|`;

document.getElementById("abc-text").textContent = abc;
const visualObj = ABCJS.renderAbc("paper", abc, { responsive: "resize" })[0];

if (ABCJS.synth.supportsAudio()) {
  const synth = new ABCJS.synth.SynthController();
  // chordsOff: false => suenan los acordes ("D", "G", "A7"...) como acompanamiento
  synth.load("#audio", null, { displayPlay: true, displayProgress: true });
  synth.setTune(visualObj, false, { chordsOff: false });
} else {
  document.getElementById("audio").textContent = "Tu navegador no soporta audio web.";
}
</script>
</body>
</html>
